services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onda
      POSTGRES_PASSWORD: onda
      POSTGRES_DB: onda
    ports:
      - "5432:5432"
    volumes:
      - onda_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - onda_redis:/data

volumes:
  onda_pg:
  onda_redis:
